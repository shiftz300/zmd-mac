name: Build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check build environment
        run: |
          uname -m
          sw_vers
          xcrun swiftc --version
          arch -x86_64 /usr/bin/true
          swift --version
      - name: Test installer
        run: swift run zmd-dev test
      - uses: actions/cache@v4
        with:
          path: .work/downloads
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('*lock.json', 'Sources/Development/Build.swift', 'Sources/Development/Renderers.swift') }}
      - name: Build standalone installer
        run: ZMD_WORK_DIR="$PWD/.work" swift run zmd-dev build
      - name: Verify package
        run: |
          release/zmd-mac/zmd doctor
          release/zmd-mac/zmd verify
          swift run zmd-dev test-pkg --package release/zmd-mac-macos-arm64.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: zmd-mac-macos-arm64
          path: |
            release/zmd-mac-macos-arm64.zip
            release/zmd-mac-macos-arm64.zip.sha256
            release/zmd-mac-macos-arm64.pkg
            release/zmd-mac-macos-arm64.pkg.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Retain Wine source and build records
        run: |
          ZMD_WORK_DIR="$PWD/.work" swift run zmd-dev sources
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-source-inputs
          path: |
            release/third-party-sources.tar.gz
            release/third-party-sources.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zmd-mac-macos-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: third-party-source-inputs
          path: release
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: swift run zmd-dev release --tag "$RELEASE_TAG" --directory release
