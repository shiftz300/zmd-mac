name: Build
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Check build environment
        run: |
          uname -m
          sw_vers
          xcrun swiftc --version
          arch -x86_64 /usr/bin/true
          python3 --version
      - name: Test installer
        run: bash scripts/test.sh
      - uses: actions/cache@v4
        with:
          path: .work/downloads
          key: downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('*lock.json', 'scripts/fetch-sources.py', 'scripts/install-moltenvk.py') }}
      - name: Build standalone installer
        run: bash scripts/build-release.sh
      - name: Verify package
        run: |
          release/zmd-mac/zmd doctor
          release/zmd-mac/zmd verify
          python3 scripts/test-pkg.py release/zmd-mac-macos-arm64.pkg
      - name: Export project source
        run: python3 scripts/export-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: zmd-mac-macos-arm64
          path: |
            release/*.zip
            release/*.pkg
            release/*.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Retain Wine source and build records
        run: |
          ZMD_WORK_DIR="$PWD/.work" python3 scripts/package-sources.py
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-source-inputs
          path: |
            release/third-party-sources.tar.gz
            release/third-party-sources.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: zmd-mac-macos-arm64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: third-party-source-inputs
          path: release
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish-release.py --tag "$RELEASE_TAG" --directory release
